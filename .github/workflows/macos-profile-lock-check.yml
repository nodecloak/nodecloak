name: macOS browser profile lock regression
on:
  workflow_dispatch:
    inputs:
      compare_legacy_term:
        type: boolean
        default: false
        description: Compare the old termination signal against normal Firefox quit
  push:
    branches: ['codex/**']
    paths:
      - src-tauri/src/platform.rs
      - src-tauri/src/platform/singleton.rs
      - src-tauri/src/profile_diagnostics.rs
      - .github/workflows/macos-profile-lock-check.yml
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: node scripts/prepare-singbox.mjs
      - run: npm run build
      - name: Record actual runner and browser versions
        run: |
          sw_vers
          uname -m
          if [ ! -x '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge' ]; then
            brew install --cask microsoft-edge
          fi
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            brew install --cask google-chrome
          fi
          '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge' --version
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version
      - name: Native lock unit regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked platform::singleton -- --nocapture
      - name: Three native Edge and Chrome close/reopen cycles
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked native_macos_chromium_profiles_reopen_with_persistent_singleton_files -- --ignored --nocapture --test-threads=1
      - name: Complete Rust regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Prepare native Firefox executable
        run: |
          if [ ! -x /Applications/Firefox.app/Contents/MacOS/firefox ]; then
            brew install --cask firefox
          fi
          cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Observe legacy Firefox termination
        if: inputs.compare_legacy_term
        continue-on-error: true
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
          NODECLOAK_TEST_LEGACY_TERM: '1'
          NODECLOAK_TEST_FIREFOX_NATIVE_HOST: ${{ github.workspace }}/src-tauri/target/debug/nodecloak
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked native_firefox_signed_fingerprint_launch_and_disable -- --ignored --nocapture --test-threads=1
      - name: Verify native Firefox normal quit and persisted cookies
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
          NODECLOAK_TEST_FIREFOX_NATIVE_HOST: ${{ github.workspace }}/src-tauri/target/debug/nodecloak
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked native_firefox_signed_fingerprint_launch_and_disable -- --ignored --nocapture --test-threads=1
