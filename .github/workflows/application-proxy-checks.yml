name: Application proxy checks
on:
  push:
    branches: ['codex/application-proxy', 'codex/macos-application-proxy']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-tun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: node scripts/prepare-singbox.mjs
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Prepare native test program
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-run --message-format=json > native-tests.json
      - name: Real Mac utun and owned launchd lifecycle
        env:
          NODECLOAK_ALLOW_MAC_TUN_TESTS: '1'
        run: python3 scripts/check-macos-application-proxy.py native-tests.json
  windows-tun:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: node scripts/prepare-singbox.mjs
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --bin nodecloak
      - name: Real TUN routing and owned teardown
        shell: pwsh
        run: |
          $env:NODECLOAK_TEST_APP_PROXY_HOST="$env:GITHUB_WORKSPACE/src-tauri/target/debug/nodecloak.exe"
          $env:NODECLOAK_TEST_SINGBOX="$env:GITHUB_WORKSPACE/.tools/singbox/win32-x64/sing-box.exe"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib installed_core_accepts_application_configs_without_network_changes -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib native_application_proxy_routes_tcp_udp_and_releases_only_owned_network -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
