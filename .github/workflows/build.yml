name: Desktop checks and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: Sign and notarize both macOS packages (main branch only)
        type: boolean
        default: true
      macos_intel_only:
        description: Rebuild only macOS Intel after other platforms pass
        type: boolean
        default: false
      macos_arm64_only:
        description: Rebuild only macOS ARM on the standard macOS 26 runner
        type: boolean
        default: false
      source_ref:
        description: Existing release tag or commit to check out for a manual rebuild
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_arm64_only && '[{"os":"macos-26","platform":"macos-arm64","target":"aarch64-apple-darwin"}]' || (inputs.macos_intel_only && '[{"os":"macos-15-intel","platform":"macos-x64","target":"x86_64-apple-darwin"}]' || '[{"os":"windows-latest","platform":"windows-x64","target":"x86_64-pc-windows-msvc"},{"os":"macos-26","platform":"macos-arm64","target":"aarch64-apple-darwin"},{"os":"macos-15-intel","platform":"macos-x64","target":"x86_64-apple-darwin"}]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOS_NOTARIZE: ${{ startsWith(matrix.platform, 'macos-') && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.notarize_macos)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Prepare pinned per-profile proxy core
        run: node scripts/prepare-singbox.mjs
      - name: Check version and tag
        run: node scripts/check-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: node --test scripts/release-checks.mjs scripts/apple-ticket-checks.mjs
      - run: npm test -- --maxWorkers=2
      - run: npm run test:session-codec
      - run: node --test scripts/fingerprint.checks.mjs
      - run: npm run test:firefox-extension
      - run: node --test scripts/mcp-page.checks.mjs
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify Chromium worker settings and recovery on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
        run: |
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then brew install --cask google-chrome; fi
          if [ ! -x '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge' ]; then brew install --cask microsoft-edge; fi
          cargo test --manifest-path src-tauri/Cargo.toml --locked native_parallel_workers_preserve_settings_and_connection -- --ignored --nocapture --test-threads=1
      - name: Verify Chromium worker settings and recovery on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
        run: |
          if (!(Test-Path 'C:/Program Files/Google/Chrome/Application/chrome.exe') -and !(Test-Path 'C:/Program Files (x86)/Google/Chrome/Application/chrome.exe')) {
            choco install googlechrome --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe') -and !(Test-Path 'C:/Program Files/Microsoft/Edge/Application/msedge.exe')) {
            choco install microsoft-edge --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --manifest-path src-tauri/Cargo.toml --locked native_parallel_workers_preserve_settings_and_connection -- --ignored --nocapture --test-threads=1
          exit $LASTEXITCODE
      - name: Verify Firefox startup on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
        run: |
          if [ ! -x /Applications/Firefox.app/Contents/MacOS/firefox ]; then
            brew install --cask firefox
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --locked native_firefox_ip_lookup_avoids_protected_startup_page -- --ignored --nocapture --test-threads=1
      - name: Verify native Firefox app launch before packaging
        if: runner.os == 'macOS'
        shell: bash
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          NODECLOAK_TEST_FIREFOX_NATIVE_HOST="$GITHUB_WORKSPACE/src-tauri/target/debug/nodecloak" cargo test --manifest-path src-tauri/Cargo.toml --locked native_firefox_signed_fingerprint_launch_and_disable -- --ignored --nocapture --test-threads=1
      - name: Verify Firefox offline session storage on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked installed_firefox_mozilla_web_storage_roundtrip -- --ignored --nocapture --test-threads=1
      - name: Verify Firefox offline session storage on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files/Mozilla Firefox/firefox.exe')) {
            choco install firefox --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --manifest-path src-tauri/Cargo.toml --locked installed_firefox_mozilla_web_storage_roundtrip -- --ignored --nocapture --test-threads=1
          exit $LASTEXITCODE
      - name: Verify large login snapshots in all installed browsers
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked installed_browsers_large_session_roundtrip -- --ignored --nocapture --test-threads=1
      - name: Verify isolated proxy cores with synthetic local nodes
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          if [ "$RUNNER_OS" = "Windows" ]; then export NODECLOAK_TEST_PROXY_HOST="$GITHUB_WORKSPACE/src-tauri/target/debug/nodecloak.exe"; else export NODECLOAK_TEST_PROXY_HOST="$GITHUB_WORKSPACE/src-tauri/target/debug/nodecloak"; fi
          core_platform=$(node -p "process.platform+'-'+process.arch")
          if [ "$RUNNER_OS" = "Windows" ]; then export NODECLOAK_TEST_SINGBOX="$GITHUB_WORKSPACE/.tools/singbox/$core_platform/sing-box.exe"; else export NODECLOAK_TEST_SINGBOX="$GITHUB_WORKSPACE/.tools/singbox/$core_platform/sing-box"; fi
          cargo test --manifest-path src-tauri/Cargo.toml --locked proxy::core::checks -- --ignored --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked native_node_credentials_copy_edit_sync_and_reset_are_scoped -- --ignored --nocapture --test-threads=1
      - name: Verify saved browser pages after profile restart
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked native_session_resume_chromium_after_protection -- --ignored --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked native_session_resume_firefox_after_region_setup -- --ignored --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked native_session_resume_firefox_system_settings_unchanged -- --ignored --nocapture --test-threads=1
      - name: Verify Windows application proxy routing and cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NODECLOAK_TEST_APP_PROXY_HOST="$env:GITHUB_WORKSPACE/src-tauri/target/debug/nodecloak.exe"
          $env:NODECLOAK_TEST_SINGBOX="$env:GITHUB_WORKSPACE/.tools/singbox/win32-x64/sing-box.exe"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib installed_core_accepts_application_configs_without_network_changes -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib native_application_proxy_routes_tcp_udp_and_releases_only_owned_network -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Verify macOS application proxy routing and cleanup
        if: runner.os == 'macOS'
        shell: bash
        env:
          NODECLOAK_ALLOW_MAC_TUN_TESTS: '1'
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-run --message-format=json > native-tests.json
          python3 scripts/check-macos-application-proxy.py native-tests.json
      - name: Import Developer ID and validate notarization credentials
        if: env.MACOS_NOTARIZE == 'true'
        run: node scripts/macos-signing.mjs prepare
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build desktop packages
        run: node scripts/build-desktop.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ ((github.event_name == 'push' && github.ref_type == 'tag') || env.MACOS_NOTARIZE == 'true') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_ID: ${{ env.MACOS_NOTARIZE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.MACOS_NOTARIZE == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.MACOS_NOTARIZE == 'true' && secrets.APPLE_TEAM_ID || '' }}
      - name: Notarize DMG and sign final updater archive
        if: env.MACOS_NOTARIZE == 'true'
        run: node scripts/macos-signing.mjs finish
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Remove temporary signing credentials
        if: always() && runner.os == 'macOS'
        run: node scripts/macos-signing.mjs cleanup
      - name: Collect release packages
        run: node scripts/collect-release-assets.mjs ${{ matrix.platform }}
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Verify native Firefox fingerprint and regional startup on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          NODECLOAK_TEST_HEADLESS_BROWSERS: '1'
          NODECLOAK_TEST_FIREFOX_NATIVE_HOST: ${{ github.workspace }}/src-tauri/target/release/nodecloak
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked native_firefox_signed_fingerprint_launch_and_disable -- --ignored --nocapture --test-threads=1
      - name: Verify node proxy startup from the final macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export NODECLOAK_TEST_PROXY_HOST="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos/NodeCloak.app/Contents/MacOS/nodecloak"
          core_platform=$(node -p "process.platform+'-'+process.arch")
          export NODECLOAK_TEST_SINGBOX="$GITHUB_WORKSPACE/.tools/singbox/$core_platform/sing-box"
          test -x "$NODECLOAK_TEST_PROXY_HOST"
          cargo test --manifest-path src-tauri/Cargo.toml --locked installed_node_transports_reach_only_local_fixture -- --ignored --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked installed_hysteria2_transfers_direct_and_udp_chain_and_rejects_bad_auth_tls -- --ignored --nocapture --test-threads=1
      - name: Verify Start menu shortcuts on installs and updates
        if: runner.os == 'Windows'
        run: node --test scripts/windows-shortcut-checks.mjs
      - name: Verify application proxy from the final Windows program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NODECLOAK_TEST_APP_PROXY_HOST="$env:GITHUB_WORKSPACE/src-tauri/target/release/nodecloak.exe"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib native_application_proxy_routes_tcp_udp_and_releases_only_owned_network -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Collect third-party notices
        run: node scripts/collect-release-notices.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - name: Record checked-out build source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          fs.writeFileSync('build-provenance.json',JSON.stringify({source,workflowSource:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,version:JSON.parse(fs.readFileSync('package.json','utf8')).version},null,2));
          console.log(`Packages built from ${source}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: nodecloak-${{ matrix.platform }}
          path: |
            release-assets/*
            release-notices/**
            build-provenance.json
          if-no-files-found: error
      - name: Save macOS notarization receipt
        if: env.MACOS_NOTARIZE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ matrix.platform }}
          path: notarization-receipts/**
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          pattern: nodecloak-*
          path: .
          merge-multiple: true
      - name: Package notices
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          tar -czf "release-assets/NodeCloak_${version}_THIRD_PARTY_NOTICES.tar.gz" -C release-notices .
      - name: Verify assets and write checksums
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Stage GitHub release for platform signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > .release-is-draft; then
            test "$(cat .release-is-draft)" = true || { echo 'Release is already published; refusing to replace assets.'; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file .release-notes.md --draft=true
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "NodeCloak $RELEASE_TAG" --notes-file .release-notes.md
          fi
