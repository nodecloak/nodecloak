name: Desktop checks and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Check version and tag
        run: node scripts/check-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: node --test scripts/release-checks.mjs
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build desktop packages
        run: node scripts/build-desktop.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Collect release packages
        run: node scripts/collect-release-assets.mjs ${{ matrix.platform }}
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Verify Start menu shortcuts on installs and updates
        if: runner.os == 'Windows'
        run: node --test scripts/windows-shortcut-checks.mjs
      - name: Collect third-party notices
        run: node scripts/collect-release-notices.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nodecloak-${{ matrix.platform }}
          path: |
            release-assets/*
            release-notices/**
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          pattern: nodecloak-*
          path: .
          merge-multiple: true
      - name: Package notices
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          tar -czf "release-assets/NodeCloak_${version}_THIRD_PARTY_NOTICES.tar.gz" -C release-notices .
      - name: Verify assets and write checksums
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Stage GitHub release for platform signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > .release-is-draft; then
            test "$(cat .release-is-draft)" = true || { echo 'Release is already published; refusing to replace assets.'; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file .release-notes.md --draft=true
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "NodeCloak $RELEASE_TAG" --notes-file .release-notes.md
          fi
