[package]
name = "nodecloak"
version = "1.0.3"
description = "Independent browser workspaces and environment diagnostics"
authors = ["NodeCloak contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nodecloak/nodecloak"
homepage = "https://nodecloak.com"

[lib]
name = "nodecloak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "socks"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
tokio-native-tls = "0.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tungstenite = "0.28"
chrono-tz = "0.10"

[dev-dependencies]
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }

