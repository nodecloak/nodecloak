[package]
name = "nodecloak"
version = "5.0.2"
description = "Independent browser workspaces and environment diagnostics"
authors = ["NodeCloak contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nodecloak/nodecloak"
homepage = "https://nodecloak.com"

[lib]
name = "nodecloak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "socks", "json"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
fs2 = "0.4"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "io-util", "io-std", "sync", "time", "macros", "rt", "rt-multi-thread"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio-native-tls = "0.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tungstenite = "0.28"
chrono-tz = "0.10"
chacha20poly1305 = "0.10"
hpke = { version = "0.13", default-features = false, features = ["std", "x25519"] }
rand_chacha = "0.9"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "2.2"
rusty-leveldb = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-autostart = "2"

[dev-dependencies]
minisign-verify = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1.3"
libc = "0.2"
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

